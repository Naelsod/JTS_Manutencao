<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTS - Gerenciamento de Máquinas</title>
    <link rel="stylesheet" href="maquinas_geren.css">
    <script src="maquinas_geren.js"></script>
    <link href="https://fonts.cdnfonts.com/css/konkhmer-sleokchher" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <a href="dashboard.html"><img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logojts-PzwZ4KGoBwJ9Duqk3ZiHD3TdhFFB6y.png" alt="JTS Logo" class="logo"></a>
            </div>
            <nav class="header-nav">
                <a href="estoque.html" class="nav-item">Almoxarifado</a>
                <a href="maquinas_geren.html" class="nav-item active">Manutenção</a>
                <a href="gerenciar.html" class="nav-item">Gerência</a>
            </nav>
        </div>
        <a href="login.html"><button class="btn-sair" id="btnSair">Sair</button></a>
    </header>

    <div class="main-container">
        <main class="content">
            <h1 class="page-title">Gerenciamento de Máquinas</h1>

            <!-- Reestruturado para colocar filtros e botão na mesma linha -->
            <div class="controls-section">
                <div class="search-container">
                    <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/ZoomIn-R6ER0JSuwkyIP46pOp1YNgFE0zssqd.png" alt="Search" class="search-icon">
                    <input type="text" id="searchInput" class="search-input" placeholder="Código da Máquina...">
                </div>

                <div class="filters-row">
                    <!-- Removido o wrapper filter-group para colocar label e select lado a lado -->
                    <div class="filters-container">
                        <span class="filters-label">Filtros</span>
                        <select id="tipoMaquina" class="filter-select">
                            <option value="">Tipo de Máquina</option>
                            <option value="retroescavadeira">Retroescavadeira</option>
                            <option value="carregadeira">Carregadeira</option>
                            <option value="escavadeira">Escavadeira</option>
                        </select>
                    </div>
                    <a href="add_maquina.html"><button class="btn-adicionar" id="btnAdicionar">+ Adicionar</button></a>
                </div>
            </div>

            <div class="machines-grid" id="machinesGrid">
                <!-- Machine Card 1 -->
                <div class="machine-card" data-status="disponivel" data-code="0001">
                    <div class="machine-header">
                        <span class="machine-code">#0001</span>
                    </div>
                    <div class="machine-image-container">
                        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/7-P3VVepwL3r6OnDNUPJbNQM9lhKIxI6.png" alt="Máquina #0001" class="machine-image">
                    </div>
                    <div class="machine-footer">
                        <span class="machine-status status-disponivel">Disponível</span>
                        <div class="machine-actions">
                            <button class="action-btn" title="Manutenção" data-action="manutencao">
                                <a href="manutencao.html"><img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Vector-2aDgiKAasfhPCcbZAV7rtclr1dlzRF.png" alt="Manutenção" class="action-icon"></a>
                            </button>
                            <button class="action-btn" title="Detalhes" data-action="detalhes">
                                <a href="manutencao.html"><img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/FileText-bHrEWvhGVd2tUXn9rLpbAlTd81za2q.png" alt="Detalhes" class="action-icon"></a>
                            </button>
                            <button class="action-btn" title="Mais opções" data-action="menu">
                                <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/png-XrWGowmFwmo6kB6u85AdfyKn01Wbf8.png" alt="Menu" class="action-icon">
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Machine Card 2 -->
                <div class="machine-card" data-status="manutencao" data-code="0002">
                    <div class="machine-header">
                        <span class="machine-code">#0002</span>
                    </div>
                    <div class="machine-image-container">
                        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/10-rpdhMOlCXJmKb220vs59Atti9rafXU.png" alt="Máquina #0002" class="machine-image">
                    </div>
                    <div class="machine-footer">
                        <span class="machine-status status-manutencao">Em Manutenção</span>
                        <div class="machine-actions">
                            <button class="action-btn" title="Manutenção" data-action="manutencao">
                                <a href="manutencao.html"><img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Vector-2aDgiKAasfhPCcbZAV7rtclr1dlzRF.png" alt="Manutenção" class="action-icon"></a>
                            </button>
                            <button class="action-btn" title="Detalhes" data-action="detalhes">
                                <a href="manutencao.html"><img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/FileText-bHrEWvhGVd2tUXn9rLpbAlTd81za2q.png" alt="Detalhes" class="action-icon"></a>
                            </button>
                            <button class="action-btn" title="Mais opções" data-action="menu">
                                <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/png-XrWGowmFwmo6kB6u85AdfyKn01Wbf8.png" alt="Menu" class="action-icon">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="notificationContainer"></div>
</body>
</html>
