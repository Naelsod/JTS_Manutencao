<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Item - JTS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adc_item.css') }}">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <a href="{{ url_for('pagina_dashboard') }}"><img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logojts-PzwZ4KGoBwJ9Duqk3ZiHD3TdhFFB6y.png" alt="JTS Logo" class="logo"></a>
            </div>
            <nav class="header-nav">
                <a href="{{ url_for('pagina_estoque') }}" class="nav-item ">Almoxarifado</a>
                <a href="{{ url_for('pagina_maquinas') }}" class="nav-item">Manutenção</a>
                <a href="{{ url_for('pagina_gerenciar') }}" class="nav-item active">Gerência</a>
            </nav>
        </div>
        <a href="{{ url_for('logout') }}"><button class="btn-sair" id="btnSair">Sair</button></a>
    </header>

    <main class="form-container">
        <h1 class="form-title">Adicionar novo item ao estoque</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('processar_item_estoque') }}" method="POST" class="add-item-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="codigo">Código do Item:</label>
                    <input type="text" id="codigo" placeholder="#0001" name="codigo_item" required>
                </div>
                
                <div class="form-group"> 
                    <label for="nome">Nome do Item:</label>
                    <input type="text" id="nome" placeholder="#Parafuso" name="nome_item" required>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" value="0" min="0" name="quantidade" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="endereco">Localização:</label>
                    <input type="text" id="endereco" placeholder="#Prateleira A-01" name="localizacao">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo"> <option value="peca">Peça</option>
                        <option value="filtro">Filtro</option>
                        <option value="cabo">Cabo</option>
                        <option value="oleo">Óleo</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca"> </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="maquina">Máquina Compatível</label>
                    <input type="text" id="maquina" name="maquina_compativel"> </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="4" name="descricao"></textarea> </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('pagina_estoque') }}" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-submit">Adicionar Item</button>
            </div>
        </form>
    </main>

</body>
</html>
